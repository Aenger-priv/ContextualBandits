[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ContextualBandit"
version = "0.2.0"
description = "Reproducible mixed-context bandit experiments on synthetic changing timelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "pandas>=2.2,<3", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29", "nbformat>=5.10", "nbclient>=0.10", "jupyterlab>=4"]
legacy = ["scikit-learn>=1.6", "statsmodels>=0.14", "seaborn>=0.13"]

[dependency-groups]
notebook = ["ipykernel>=6.29", "nbformat>=5.10", "nbclient>=0.10", "jupyterlab>=4"]
dev = ["ruff>=0.6"]

[tool.uv]
default-groups = ["notebook"]

[tool.hatch.build.targets.wheel]
packages = ["contextual_bandits"]

[tool.hatch.build.targets.wheel.force-include]
"configs/defaults.json" = "contextual_bandits/defaults.json"

[tool.hatch.build.targets.sdist]
include = ["contextual_bandits/", "configs/", "scripts/", "tests/", "*.ipynb", "README.md", "LICENSE", "pyproject.toml", "uv.lock", "fx_trading_dataset.json", "volatility_series.csv", "bandit_*.py", "data_generator.py"]
